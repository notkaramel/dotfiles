enable_esc_key = true
position = "Top"

[appearance.menu]
opacity = 0.8
backdrop = 0.7

[appearance]
font_name = "Fira Code"
scale_factor = 1
style = "Gradient"
opacity = 0.4
success_color = "#a6e3a1"
text_color = "#cdd6f4"

workspace_colors = [ "#fab387", "#b4befe", "#cba6f7" ]

[appearance.primary_color]
base = "#fab387"
text = "#1e1e2e"

[appearance.danger_color]
base = "#f38ba8"
weak = "#f9e2af"

[appearance.background_color]
base = "#1e1e2e"
weak = "#313244"
strong = "#45475a"

[appearance.secondary_color]
base = "#11111b"
strong = "#1b1b25"

[modules]
left = [ "Workspaces", "WindowTitle" ]
center = [ "Clock", "Privacy"]
right = [  "MediaPlayer", "Tray", "SystemInfo", "Settings" ]

[workspaces]
visibility_mode = "MonitorSpecific"
enable_workspace_filling = false

[media_player]
max_title_length = 42

[window_title]
mode = "Title"
truncate_title_after_length = 75

[system_info]
indicators = [ "Cpu", "Memory", "Temperature" ]

[system_info.cpu]
warn_threshold = 60
alert_threshold = 80

[system_info.memory]
warn_threshold = 70
alert_threshold = 85

[system_info.disk]
warn_threshold = 80
alert_threshold = 90

[system_info.temperature]
warn_threshold = 60
alert_threshold = 80
sensor = "acpitz temp1"

[settings]
indicators = ["Audio", "Bluetooth", "Network", "Battery"]
remove_airplane_btn = true
remove_idle_btn = true
battery_format = "IconAndPercentage"
peripheral_battery_format = "Icon"
peripheral_indicators = "All"

